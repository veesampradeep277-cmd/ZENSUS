<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>ZENSUS — Direction Before Destination</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Inter, Arial, sans-serif;
    }

    /* =====================================================
       SCENE
    ===================================================== */

    .scene {
      position: relative;
      width: 100%;
      height: 100vh;
      overflow: hidden;

      background-image:
        linear-gradient(
          rgba(0, 0, 0, 0.08),
          rgba(0, 0, 0, 0.28)
        ),
        url("./assets/zensus-space-bg.png");

      background-position: center;
      background-size: cover;
      background-repeat: no-repeat;
    }

    /*
      Cinematic vignette
    */

    .scene::after {
      content: "";

      position: absolute;
      inset: 0;

      pointer-events: none;

      background:
        radial-gradient(
          circle at center,
          transparent 35%,
          rgba(0, 0, 0, 0.15) 65%,
          rgba(0, 0, 0, 0.65) 100%
        );

      z-index: 20;
    }

    /* =====================================================
       THREE.JS CANVAS
    ===================================================== */

    #globe-container {
      position: absolute;

      width: min(58vw, 760px);
      height: min(58vw, 760px);

      left: 50%;
      top: 47%;

      transform: translate(-50%, -50%);

      z-index: 5;

      pointer-events: none;
    }

    #globe-container canvas {
      display: block;

      width: 100% !important;
      height: 100% !important;
    }

    /* =====================================================
       ZENSUS BRAND
    ===================================================== */

    .brand {
      position: absolute;

      top: 30px;
      left: 50%;

      transform: translateX(-50%);

      z-index: 30;

      text-align: center;

      color: white;

      font-size: 15px;
      font-weight: 700;

      letter-spacing: 8px;

      text-shadow:
        0 0 12px rgba(100, 180, 255, 0.8),
        0 0 35px rgba(60, 120, 255, 0.45);
    }

    .brand span {
      display: block;

      margin-top: 8px;

      font-size: 8px;

      font-weight: 400;

      letter-spacing: 5px;

      color: rgba(205, 220, 245, 0.65);
    }

    /* =====================================================
       CARDS
    ===================================================== */

    .cards {
      position: absolute;

      inset: 0;

      z-index: 30;

      pointer-events: none;
    }

    .card {
      position: absolute;

      width: 250px;
      min-height: 165px;

      padding: 24px;

      border-radius: 20px;

      pointer-events: auto;

      color: white;

      background:
        linear-gradient(
          145deg,
          rgba(10, 20, 40, 0.78),
          rgba(2, 7, 17, 0.58)
        );

      border:
        1px solid rgba(150, 205, 255, 0.32);

      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);

      box-shadow:
        0 25px 70px rgba(0, 0, 0, 0.55),
        inset 0 0 25px rgba(100, 170, 255, 0.05);

      transition:
        transform 0.35s ease,
        border-color 0.35s ease,
        box-shadow 0.35s ease;
    }

    .card:hover {
      transform: translateY(-10px) scale(1.025);

      border-color:
        rgba(150, 220, 255, 0.85);

      box-shadow:
        0 30px 80px rgba(0, 0, 0, 0.7),
        0 0 35px rgba(60, 150, 255, 0.25);
    }

    /* DSA */

    .card-dsa {
      left: 6%;
      top: 31%;

      animation:
        floatingOne 5s ease-in-out infinite;
    }

    /* SQL */

    .card-sql {
      left: 6%;
      bottom: 19%;

      animation:
        floatingTwo 5.7s ease-in-out infinite;
    }

    /* Web */

    .card-web {
      right: 6%;
      top: 40%;

      animation:
        floatingThree 6s ease-in-out infinite;
    }

    @keyframes floatingOne {
      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-9px);
      }
    }

    @keyframes floatingTwo {
      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(8px);
      }
    }

    @keyframes floatingThree {
      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-11px);
      }
    }

    /* =====================================================
       CARD CONTENT
    ===================================================== */

    .card-label {
      font-size: 9px;

      letter-spacing: 3px;

      color:
        rgba(180, 205, 235, 0.55);

      margin-bottom: 15px;
    }

    .card-icon {
      width: 45px;
      height: 45px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 13px;

      margin-bottom: 14px;

      font-size: 21px;

      color: #7fc5ff;

      background:
        rgba(70, 160, 255, 0.12);

      border:
        1px solid rgba(90, 175, 255, 0.32);

      box-shadow:
        0 0 20px rgba(70, 160, 255, 0.12);
    }

    .card-sql .card-icon {
      color: #c47cff;

      background:
        rgba(170, 70, 255, 0.12);

      border-color:
        rgba(190, 100, 255, 0.35);
    }

    .card-web .card-icon {
      color: #ffbd63;

      background:
        rgba(255, 165, 60, 0.12);

      border-color:
        rgba(255, 180, 80, 0.35);
    }

    .card h2 {
      font-size: 23px;

      line-height: 1.15;

      margin-bottom: 7px;

      letter-spacing: 0.3px;
    }

    .card-web h2 {
      font-size: 19px;
    }

    .card p {
      font-size: 12px;

      line-height: 1.55;

      color:
        rgba(215, 228, 245, 0.68);
    }

    .card-line {
      width: 50px;
      height: 2px;

      margin-top: 16px;

      background:
        linear-gradient(
          90deg,
          #55b4ff,
          transparent
        );

      box-shadow:
        0 0 10px rgba(70, 170, 255, 0.8);
    }

    .card-sql .card-line {
      background:
        linear-gradient(
          90deg,
          #a95cff,
          transparent
        );
    }

    .card-web .card-line {
      background:
        linear-gradient(
          90deg,
          #ffb454,
          transparent
        );
    }

    /* =====================================================
       ORBITING LINES
    ===================================================== */

    .orbit-line {
      position: absolute;

      left: 50%;
      top: 48%;

      width: 72vw;
      max-width: 1000px;

      height: 220px;

      transform:
        translate(-50%, -50%)
        rotate(-9deg);

      border:
        1px solid rgba(70, 165, 255, 0.32);

      border-radius: 50%;

      z-index: 8;

      pointer-events: none;

      box-shadow:
        0 0 15px rgba(60, 150, 255, 0.12);
    }

    .orbit-line::after {
      content: "";

      position: absolute;

      width: 85px;
      height: 3px;

      top: -1px;
      left: 0;

      border-radius: 50%;

      background:
        linear-gradient(
          90deg,
          transparent,
          white,
          #55b9ff,
          transparent
        );

      filter:
        drop-shadow(
          0 0 10px #54b9ff
        );

      animation:
        orbitParticle 4s linear infinite;
    }

    @keyframes orbitParticle {
      from {
        left: -90px;
      }

      to {
        left: 100%;
      }
    }

    .orbit-line.two {
      width: 65vw;
      max-width: 900px;

      height: 180px;

      transform:
        translate(-50%, -50%)
        rotate(12deg);

      border-color:
        rgba(180, 80, 255, 0.22);
    }

    .orbit-line.two::after {
      animation-duration: 5.5s;

      background:
        linear-gradient(
          90deg,
          transparent,
          white,
          #b15cff,
          transparent
        );
    }

    /* =====================================================
       DIRECTION BEFORE DESTINATION
    ===================================================== */

    .direction {
      position: absolute;

      left: 50%;
      bottom: 6%;

      transform: translateX(-50%);

      z-index: 30;

      text-align: center;

      white-space: nowrap;
    }

    .direction-title {
      font-size:
        clamp(22px, 3vw, 43px);

      font-weight: 300;

      letter-spacing:
        clamp(4px, 0.7vw, 9px);

      color:
        rgba(240, 247, 255, 0.95);

      text-shadow:
        0 0 20px rgba(75, 165, 255, 0.45);
    }

    .direction-title strong {
      font-weight: 600;

      background:
        linear-gradient(
          90deg,
          #63b9ff,
          #ffffff,
          #ffbf6a
        );

      background-size: 200% 100%;

      -webkit-background-clip: text;
      background-clip: text;

      color: transparent;

      animation:
        titleFlow 4s linear infinite;
    }

    @keyframes titleFlow {
      from {
        background-position: 200% 0;
      }

      to {
        background-position: -200% 0;
      }
    }

    .direction-line {
      position: relative;

      width: 560px;
      max-width: 75vw;

      height: 2px;

      margin: 16px auto 0;

      overflow: hidden;

      background:
        linear-gradient(
          90deg,
          transparent,
          #3eabff,
          #ffffff,
          #ffb85e,
          transparent
        );

      box-shadow:
        0 0 14px rgba(70, 165, 255, 0.55);
    }

    .direction-line::after {
      content: "";

      position: absolute;

      top: -3px;
      left: -80px;

      width: 80px;
      height: 8px;

      background:
        linear-gradient(
          90deg,
          transparent,
          white
        );

      filter:
        blur(1px)
        drop-shadow(0 0 10px white);

      animation:
        directionTravel 2.8s linear infinite;
    }

    @keyframes directionTravel {
      from {
        left: -80px;
      }

      to {
        left: 100%;
      }
    }

    /* =====================================================
       RESPONSIVE
    ===================================================== */

    @media (max-width: 900px) {

      #globe-container {
        width: 65vw;
        height: 65vw;
      }

      .card {
        width: 205px;
        padding: 18px;
      }

      .card-dsa {
        left: 2%;
      }

      .card-sql {
        left: 2%;
      }

      .card-web {
        right: 2%;
      }
    }

    @media (max-width: 700px) {

      body {
        overflow-y: auto;
      }

      .scene {
        min-height: 900px;
        height: 100vh;
      }

      #globe-container {
        width: 78vw;
        height: 78vw;

        top: 42%;
      }

      .card {
        width: 165px;
        min-height: 120px;

        padding: 14px;
      }

      .card-dsa {
        left: 2%;
        top: 25%;
      }

      .card-sql {
        left: 2%;
        bottom: 19%;
      }

      .card-web {
        right: 2%;
        top: 31%;
      }

      .card h2 {
        font-size: 17px;
      }

      .card-web h2 {
        font-size: 14px;
      }

      .card p {
        font-size: 9px;
      }

      .card-icon {
        width: 35px;
        height: 35px;

        font-size: 16px;
      }

      .direction {
        bottom: 4%;
      }

      .direction-title {
        font-size: 16px;
        letter-spacing: 3px;
      }
    }

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>


<body>

  <main class="scene">

    <!-- =====================================================
         BRAND
    ====================================================== -->

    <div class="brand">
      ZENSUS

      <span>
        LEARN · BUILD · CREATE
      </span>
    </div>


    <!-- =====================================================
         REAL 3D EARTH
    ====================================================== -->

    <div id="globe-container"></div>


    <!-- =====================================================
         ORBIT LINES
    ====================================================== -->

    <div class="orbit-line"></div>
    <div class="orbit-line two"></div>


    <!-- =====================================================
         LEARNING CARDS
    ====================================================== -->

    <section class="cards">

      <!-- DSA -->

      <article
        class="card card-dsa"
        onclick="location.href='./coding-problems/'"
      >

        <div class="card-label">
          01 · THINK
        </div>

        <div class="card-icon">
          &lt;/&gt;
        </div>

        <h2>
          DSA
        </h2>

        <p>
          Data Structures & Algorithms
          <br>
          Think · Solve · Grow
        </p>

        <div class="card-line"></div>

      </article>


      <!-- SQL -->

      <article
        class="card card-sql"
        onclick="location.href='./sql/'"
      >

        <div class="card-label">
          02 · ANALYZE
        </div>

        <div class="card-icon">
          ◉
        </div>

        <h2>
          SQL
        </h2>

        <p>
          Database & Query Logic
          <br>
          Query · Analyze · Build
        </p>

        <div class="card-line"></div>

      </article>


      <!-- WEB DEVELOPMENT -->

      <article
        class="card card-web"
        onclick="location.href='./web-development/'"
      >

        <div class="card-label">
          03 · CREATE
        </div>

        <div class="card-icon">
          ◇
        </div>

        <h2>
          WEB DEVELOPMENT
        </h2>

        <p>
          Modern Web Technologies
          <br>
          Design · Code · Deploy
        </p>

        <div class="card-line"></div>

      </article>

    </section>


    <!-- =====================================================
         TAGLINE
    ====================================================== -->

    <section class="direction">

      <div class="direction-title">

        <strong>DIRECTION</strong>

        &nbsp; BEFORE &nbsp;

        <strong>DESTINATION</strong>

      </div>

      <div class="direction-line"></div>

    </section>

  </main>


  <!-- =======================================================
       THREE.JS
  ======================================================== -->

  <script type="importmap">
  {
    "imports": {
      "three":
        "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"
    }
  }
  </script>


  <script type="module">

    import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";


    /* ======================================================
       BASIC SETUP
    ====================================================== */

    const container =
      document.getElementById("globe-container");

    const scene =
      new THREE.Scene();


    const camera =
      new THREE.PerspectiveCamera(
        35,
        container.clientWidth /
          container.clientHeight,
        0.1,
        100
      );

    camera.position.z = 3.5;


    const renderer =
      new THREE.WebGLRenderer({
        antialias: true,
        alpha: true
      });


    renderer.setPixelRatio(
      Math.min(window.devicePixelRatio, 2)
    );


    renderer.setSize(
      container.clientWidth,
      container.clientHeight
    );


    renderer.outputColorSpace =
      THREE.SRGBColorSpace;


    container.appendChild(renderer.domElement);


    /* ======================================================
       EARTH GROUP
    ====================================================== */

    const earthGroup =
      new THREE.Group();

    scene.add(earthGroup);


    /* ======================================================
       EARTH
    ====================================================== */

    const earthGeometry =
      new THREE.SphereGeometry(
        1,
        96,
        96
      );


    /*
      NASA-style public Earth texture.

      If you want completely local/offline operation,
      replace this URL later with:

      ./assets/earth.jpg
    */

    const textureLoader =
      new THREE.TextureLoader();


    const earthTexture =
      textureLoader.load(
        "https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg"
      );


    earthTexture.colorSpace =
      THREE.SRGBColorSpace;


    const earthMaterial =
      new THREE.MeshPhongMaterial({

        map: earthTexture,

        shininess: 8,

        specular:
          new THREE.Color(0x223344)

      });


    const earth =
      new THREE.Mesh(
        earthGeometry,
        earthMaterial
      );


    earthGroup.add(earth);


    /* ======================================================
       NIGHT CITY LIGHTS
    ====================================================== */

    const nightTexture =
      textureLoader.load(
        "https://threejs.org/examples/textures/planets/earth_lights_2048.png"
      );


    const nightMaterial =
      new THREE.MeshBasicMaterial({

        map: nightTexture,

        transparent: true,

        opacity: 0.85,

        blending:
          THREE.AdditiveBlending

      });


    const nightEarth =
      new THREE.Mesh(
        new THREE.SphereGeometry(
          1.006,
          96,
          96
        ),
        nightMaterial
      );


    earthGroup.add(nightEarth);


    /* ======================================================
       ATMOSPHERE
    ====================================================== */

    const atmosphereGeometry =
      new THREE.SphereGeometry(
        1.035,
        96,
        96
      );


    const atmosphereMaterial =
      new THREE.MeshBasicMaterial({

        color: 0x3b9cff,

        transparent: true,

        opacity: 0.14,

        side: THREE.BackSide,

        blending:
          THREE.AdditiveBlending

      });


    const atmosphere =
      new THREE.Mesh(
        atmosphereGeometry,
        atmosphereMaterial
      );


    earthGroup.add(atmosphere);


    /* ======================================================
       LIGHTING
    ====================================================== */

    const ambientLight =
      new THREE.AmbientLight(
        0x557799,
        0.32
      );


    scene.add(ambientLight);


    const sun =
      new THREE.DirectionalLight(
        0xbddcff,
        2.2
      );


    sun.position.set(
      4,
      2,
      5
    );


    scene.add(sun);


    /* ======================================================
       STAR PARTICLES
    ====================================================== */

    const starGeometry =
      new THREE.BufferGeometry();


    const starCount = 1800;

    const starPositions =
      new Float32Array(
        starCount * 3
      );


    for (
      let i = 0;
      i < starCount;
      i++
    ) {

      const radius =
        5 + Math.random() * 10;

      const theta =
        Math.random() * Math.PI * 2;

      const phi =
        Math.acos(
          2 * Math.random() - 1
        );


      starPositions[i * 3] =
        radius *
        Math.sin(phi) *
        Math.cos(theta);

      starPositions[i * 3 + 1] =
        radius *
        Math.sin(phi) *
        Math.sin(theta);

      starPositions[i * 3 + 2] =
        radius *
        Math.cos(phi);
    }


    starGeometry.setAttribute(
      "position",

      new THREE.BufferAttribute(
        starPositions,
        3
      )
    );


    const starMaterial =
      new THREE.PointsMaterial({

        color: 0xffffff,

        size: 0.025,

        transparent: true,

        opacity: 0.7

      });


    const stars =
      new THREE.Points(
        starGeometry,
        starMaterial
      );


    scene.add(stars);


    /* ======================================================
       MOUSE PARALLAX
    ====================================================== */

    let targetX = 0;
    let targetY = 0;

    let currentX = 0;
    let currentY = 0;


    window.addEventListener(
      "mousemove",
      (event) => {

        targetX =
          (event.clientX /
            window.innerWidth -
            0.5) * 0.35;

        targetY =
          (event.clientY /
            window.innerHeight -
            0.5) * 0.2;

      }
    );


    /* ======================================================
       ANIMATION
    ====================================================== */

    const clock =
      new THREE.Clock();


    function animate() {

      requestAnimationFrame(
        animate
      );


      const elapsed =
        clock.getElapsedTime();


      /*
        Actual Earth rotation
      */

      earth.rotation.y +=
        0.0025;

      nightEarth.rotation.y =
        earth.rotation.y;


      /*
        Slow atmosphere movement
      */

      atmosphere.rotation.y =
        earth.rotation.y * 0.96;


      /*
        Galaxy movement
      */

      stars.rotation.y =
        elapsed * 0.003;


      stars.rotation.x =
        elapsed * 0.001;


      /*
        Smooth mouse movement
      */

      currentX +=
        (targetX - currentX) *
        0.035;

      currentY +=
        (targetY - currentY) *
        0.035;


      earthGroup.rotation.y =
        currentX;

      earthGroup.rotation.x =
        currentY;


      renderer.render(
        scene,
        camera
      );

    }


    animate();


    /* ======================================================
       RESIZE
    ====================================================== */

    window.addEventListener(
      "resize",
      () => {

        const width =
          container.clientWidth;

        const height =
          container.clientHeight;


        camera.aspect =
          width / height;

        camera.updateProjectionMatrix();


        renderer.setSize(
          width,
          height
        );

      }
    );

  </script>

</body>
</html>
